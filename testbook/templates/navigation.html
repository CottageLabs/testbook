<div class="panel-title-row">
    <h2>Test Suites</h2>
    {% if suite_payload %}

        <button class="btn-expand-all" type="button" title="Expand all">▼</button>
        <button class="btn-collapse-all" type="button" title="Collapse all">▶</button>
        <span class="badge">{{ suite_payload | length }}</span>

</div>
